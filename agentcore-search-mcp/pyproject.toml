[project]
name = "agentcore-search-mcp"
version = "0.1.0"
description = "MCP server bridging Amazon Bedrock AgentCore Gateway WebSearch (SigV4) to any MCP client"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT-0" }
authors = [{ name = "AWS Samples" }]
keywords = ["mcp", "model-context-protocol", "bedrock", "agentcore", "web-search", "aws"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT No Attribution License (MIT-0)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "mcp>=1.2",
    "httpx>=0.27",
    "botocore>=1.34",
]

[project.urls]
Repository = "https://github.com/aws-samples/sample-bedrock-api-proxy"
Documentation = "https://github.com/aws-samples/sample-bedrock-api-proxy/tree/main/agentcore-search-mcp#readme"

[project.scripts]
agentcore-search-mcp = "agentcore_search_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "black>=24",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcore_search_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
